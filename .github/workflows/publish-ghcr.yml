name: Publish fork proxy image

on:
  push:
    branches:
      - ci/publish-proxy-efdd1f8

permissions:
  contents: read
  packages: write

env:
  SOURCE_REVISION: efdd1f8831a9a888a5b0bb4945ddb629fffc6723
  IMAGE: ghcr.io/ehopealot/proxy-everything
  TAG: efdd1f8831a9a888a5b0bb4945ddb629fffc6723

jobs:
  publish:
    if: github.repository == 'ehopealot/proxy-everything' && github.ref == 'refs/heads/ci/publish-proxy-efdd1f8'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify publication branch contains only this workflow
        run: |
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          git diff --quiet "$SOURCE_REVISION" HEAD -- . ':!.github/workflows/publish-ghcr.yml' ':!test/verify-publish-ghcr-workflow.sh'

      - name: Check out reviewed proxy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish reviewed image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: source
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/ehopealot/proxy-everything
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Record immutable digest
        run: |
          echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
